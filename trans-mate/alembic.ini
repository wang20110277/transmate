[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# 仅在离线模式（alembic upgrade --sql）下使用；
# 在线模式由 alembic/env.py 用 app.core.database.DATABASE_URL（读 .env）覆盖，此处不会被连接。
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/trans_mate

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
